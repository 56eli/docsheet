      security_privacy: 8
      tests: 7
      readme_onboarding: 7
      ci_cd: 7
      agent_readiness: 8
    notes:
    - Overall effective score is 694/86 = 8.1 (deployment_readiness and github_pages_presentation rose after the live build was verified
      byte-identical to source; error_handling_logging rose after the formatter defect was confirmed fixed).
    - All required aspect thresholds pass and the overall score clears the 8.0 floor.
    - PR #64 (54b37f7) is deployed; main CI 31379726756 passes; live build-manifest.json and deployed columns.js are byte-verified.
    - Gate is conditional on (a) owner applying CI-gated (Actions) Pages and (b) owner visual acceptance (manifest acceptance=owner_visual_review_required);
      user scores are preserved and never inferred from merge, silence, or PR approval.
