meta:
  project_name: docsheet
  scoreboard_version: 1
  last_updated: "2026-08-09"
  stale_after_days: 45
  agent_model: arena_sandboxed_agent
  effective_score_policy: user_score_overrides_ai_score
  context_policy: repo_files_are_durable_memory
  arena_context: "Agent sessions are sandboxed and may expire after PR merge; durable context must live in repo files."

manual_workflow_policy:
  may_edit_github_workflows: false
  instruction: "Do not edit .github/workflows/* unless the user explicitly instructs you. If workflow changes are needed, document exact GitHub web editor steps in .scoreboard/manual-workflow-edits.md."

summary:
  overall_effective_score: 7.9
  repo_ready_gate_status: fail
  top_priorities:
    - github_pages_presentation
    - ux_usability
    - maintainability
    - code_hygiene
    - content_quality
    - repo_organization
  active_risk_flags:
    - "CSP style-src 'unsafe-inline' is required for the dark-mode/theme toggles (low severity; script-src stays hash-pinned and Tabulator is SRI-pinned)."
    - "Owner user scores (2026-08-09): github_pages_presentation 5, ux_usability 5, content_quality 7, maintainability 6 — effective scores fall below target for these aspects (user_unhappy / needs_work); AI scores and evidence unchanged."

quality_gates:
  repo_ready:
    status: fail
    overall_effective_score: 7.9
    last_evaluated: "2026-08-09"
    minimum_overall_effective_score: 8
    required:
      security_privacy: 8
      tests: 7
      readme_onboarding: 7
      ci_cd: 7
      agent_readiness: 8
    notes:
      - "Quality gates use effective_score."
      - "User overrides may satisfy a numeric gate, but risk_flags must remain visible."
      - "If a gate is satisfied only because of user_score while ai_score is low, mark the relevant aspect as accepted_debt or risk_accepted."
      - "If required aspects have active risk_flags, mention them in SCOREBOARD.md even when the gate numerically passes."
      - "2026-08-09 baseline: numeric thresholds initially passed (8.4 >= 8) with gate WARNING (low-severity risk flag + medium-confidence items)."
      - "2026-08-09 (after owner user scores): effective scores for github_pages_presentation (5), ux_usability (5), content_quality (7), maintainability (6) moved the weighted average to 7.9 — below the 8 minimum — so the gate is now FAIL. Required aspect minimums still pass individually; the overall minimum does not. AI scores are unchanged; the owner's scores drive priority."

