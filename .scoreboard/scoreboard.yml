meta:
  project_name: docsheet
  scoreboard_version: 1
  last_updated: '2026-08-10'
  stale_after_days: 45
  agent_model: arena_sandboxed_agent
  effective_score_policy: user_score_overrides_ai_score
  context_policy: repo_files_are_durable_memory
  arena_context: Agent sessions are sandboxed and may expire after PR merge; durable context must live in repo files.
manual_workflow_policy:
  may_edit_github_workflows: false
  instruction: Do not edit .github/workflows/* unless the user explicitly instructs it; record required owner actions in .scoreboard/manual-workflow-edits.md.
summary:
  overall_effective_score: 8.1
  repo_ready_gate_status: conditional_pass
  top_priorities:
  - ci_cd
  - github_pages_presentation
  - deployment_readiness
  - error_handling_logging
  active_risk_flags:
  - 'RESOLVED 2026-08-10: PR #64 (54b37f7) is merged, deployed (Pages built @10:34Z), main CI 31379726756 green, and the live build-manifest/columns.js
    are byte-verified to carry the P0 fix. The broken-baseline blocker is closed.'
  - Pages API still reports legacy main:/docs deployment, so public deployment can still outrun CI until the owner applies Actions-based
    gated Pages (manual-workflow-edits.md). This is the single remaining delivery risk.
  - CI syntax-checks app.js but not the extracted docs/js/*.js modules, and there is no no-undef lint — both are agent-safe quick wins
    that would catch the next P0-class defect pre-browser.
  - CSP style-src 'unsafe-inline' remains low-severity debt; scripts are hash-pinned and Tabulator is SRI-pinned.
quality_gates:
