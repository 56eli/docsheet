  repo_ready_gate_status: fail
  top_priorities:
    - github_pages_presentation
    - ux_usability
    - maintainability
    - code_hygiene
    - ci_cd
    - content_quality
    - repo_organization
  active_risk_flags:
    - "CSP style-src 'unsafe-inline' is required for the dark-mode/theme toggles (low severity; script-src stays hash-pinned and Tabulator is SRI-pinned)."
    - "Pages deploys main independently of CI and observed PRs merged before checks completed; require CI and gate Pages before treating a green deployment as validated."
    - "The raw Original Spreadsheet and curated Everything view are separate payloads; owner corrections in docs/master.json intentionally do not alter docs/data.json."
    - "Owner user scores (2026-08-09): github_pages_presentation 5, ux_usability 5, content_quality 7, maintainability 6 — effective scores remain below target for these aspects."

quality_gates:
  repo_ready:
    status: fail
    overall_effective_score: 7.6
    last_evaluated: "2026-08-09"
    minimum_overall_effective_score: 8
    required:
      security_privacy: 8
      tests: 7
      readme_onboarding: 7
      ci_cd: 7
      agent_readiness: 8
    notes:
      - "Quality gates use effective_score."
      - "User overrides may satisfy a numeric gate, but risk_flags must remain visible."
      - "If a gate is satisfied only because of user_score while ai_score is low, mark the relevant aspect as accepted_debt or risk_accepted."
      - "If required aspects have active risk_flags, mention them in SCOREBOARD.md even when the gate numerically passes."
      - "2026-08-09 baseline: numeric thresholds initially passed (8.4 >= 8) with gate WARNING (low-severity risk flag + medium-confidence items)."
